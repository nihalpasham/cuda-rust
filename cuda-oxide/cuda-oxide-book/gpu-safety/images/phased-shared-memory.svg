<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    :root, svg {
      --bg: #ffffff;
      --bg-stroke: #e2e8f0;
      --panel: #f8fafc;
      --panel-stroke: #cbd5e1;
      --fg: #0f172a;
      --text: #334155;
      --sub: #475569;
      --muted: #64748b;
      --green: #15803d;
      --green-text: #14532d;
      --green-sub: #166534;
      --green-fill: #dcfce7;
      --green-soft: #f0fdf4;
      --blue: #2563eb;
      --blue-text: #1e3a8a;
      --blue-fill: #dbeafe;
      --blue-soft: #eff6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --bg: #161b22;
        --bg-stroke: #30363d;
        --panel: #1e242c;
        --panel-stroke: #3d444d;
        --fg: #f0f6fc;
        --text: #c9d1d9;
        --sub: #b1bac4;
        --muted: #8b949e;
        --green: #3fb950;
        --green-text: #7ee787;
        --green-sub: #56d364;
        --green-fill: #163323;
        --green-soft: #12261e;
        --blue: #58a6ff;
        --blue-text: #a5d6ff;
        --blue-fill: #172b4d;
        --blue-soft: #132238;
      }
    }
  </style>
  <defs>
    <marker id="arrow-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0.8 L 7.5 4 L 0 7.2 Z" style="fill: var(--green)"/>
    </marker>
    <marker id="arrow-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0.8 L 7.5 4 L 0 7.2 Z" style="fill: var(--blue)"/>
    </marker>
  </defs>

  <rect width="1080" height="380" rx="14" style="fill: var(--bg); stroke: var(--bg-stroke)" stroke-width="1.5"/>

  <text x="40" y="40" font-size="18" font-weight="700" style="fill: var(--fg)">Phased Shared-Memory Verification in 2D Tiled SGEMM</text>
  <text x="40" y="62" font-size="13" style="fill: var(--muted)">Why Thread 1 writing <tspan font-family="'Roboto Mono', monospace">TILE_A[1]</tspan> and Thread 0 reading <tspan font-family="'Roboto Mono', monospace">TILE_A[1]</tspan> is proven data-race-free.</text>

  <!-- Left Box: Phase 0 -->
  <g transform="translate(36, 88)">
    <rect width="420" height="254" rx="10" style="fill: var(--panel); stroke: var(--panel-stroke)" stroke-width="1.5"/>
    <text x="24" y="30" font-size="15" font-weight="700" style="fill: var(--fg)">Phase 0: Cooperative Tile Stage</text>
    <text x="24" y="50" font-family="'Roboto Mono', monospace" font-size="12" style="fill: var(--green)">pattern := .threadSlot 16, loopBound := 1</text>

    <!-- Threads -->
    <circle cx="95"  cy="92" r="15" style="fill: var(--green-soft); stroke: var(--green)" stroke-width="2"/>
    <text x="95"  y="96" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--green-text)">t₀</text>
    <circle cx="165" cy="92" r="15" style="fill: var(--green-soft); stroke: var(--green)" stroke-width="2"/>
    <text x="165" y="96" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--green-text)">t₁</text>
    <circle cx="235" cy="92" r="15" style="fill: var(--green-soft); stroke: var(--green)" stroke-width="2"/>
    <text x="235" y="96" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--green-text)">t₂</text>
    <circle cx="305" cy="92" r="15" style="fill: var(--green-soft); stroke: var(--green)" stroke-width="2"/>
    <text x="305" y="96" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--green-text)">t₃</text>

    <!-- Parallel disjoint write arrows -->
    <line x1="95"  y1="110" x2="95"  y2="156" style="stroke: var(--green)" stroke-width="2" marker-end="url(#arrow-g)"/>
    <line x1="165" y1="110" x2="165" y2="156" style="stroke: var(--green)" stroke-width="2" marker-end="url(#arrow-g)"/>
    <line x1="235" y1="110" x2="235" y2="156" style="stroke: var(--green)" stroke-width="2" marker-end="url(#arrow-g)"/>
    <line x1="305" y1="110" x2="305" y2="156" style="stroke: var(--green)" stroke-width="2" marker-end="url(#arrow-g)"/>

    <!-- Shared Array Slots -->
    <rect x="62"  y="162" width="66" height="36" rx="4" style="fill: var(--green-fill); stroke: var(--green)" stroke-width="1.5"/>
    <text x="95"  y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--green-text)">TILE[0]</text>
    <rect x="132" y="162" width="66" height="36" rx="4" style="fill: var(--green-fill); stroke: var(--green)" stroke-width="1.5"/>
    <text x="165" y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--green-text)">TILE[1]</text>
    <rect x="202" y="162" width="66" height="36" rx="4" style="fill: var(--green-fill); stroke: var(--green)" stroke-width="1.5"/>
    <text x="235" y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--green-text)">TILE[2]</text>
    <rect x="272" y="162" width="66" height="36" rx="4" style="fill: var(--green-fill); stroke: var(--green)" stroke-width="1.5"/>
    <text x="305" y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--green-text)">TILE[3]</text>

    <text x="210" y="226" text-anchor="middle" font-size="12.5" style="fill: var(--text)">1 write per thread (<tspan font-family="'Roboto Mono', monospace">ty * 16 + tx</tspan>): disjoint slots.</text>
  </g>

  <!-- Center Barrier Wall -->
  <g transform="translate(476, 88)">
    <rect x="12" y="0" width="104" height="254" rx="8" style="fill: var(--green-soft); stroke: var(--green)" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="64" y="118" text-anchor="middle" font-size="13" font-weight="700" style="fill: var(--green-text)">BARRIER</text>
    <text x="64" y="138" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" style="fill: var(--green)">sync_threads()</text>
    <text x="64" y="162" text-anchor="middle" font-size="11" style="fill: var(--green-sub)">Phase 0 ≠ Phase 1</text>
  </g>

  <!-- Right Box: Phase 1 -->
  <g transform="translate(624, 88)">
    <rect width="420" height="254" rx="10" style="fill: var(--panel); stroke: var(--panel-stroke)" stroke-width="1.5"/>
    <text x="24" y="30" font-size="15" font-weight="700" style="fill: var(--fg)">Phase 1: Dot-Product Row/Col Scan</text>
    <text x="24" y="50" font-family="'Roboto Mono', monospace" font-size="12" style="fill: var(--blue)">pattern := .rowScan 16, loopBound := 16</text>

    <!-- Thread t0 scanning across row -->
    <circle cx="130" cy="92" r="15" style="fill: var(--blue-soft); stroke: var(--blue)" stroke-width="2"/>
    <text x="130" y="96" text-anchor="middle" font-size="11" font-weight="700" style="fill: var(--blue-text)">t₀</text>
    <text x="245" y="96" font-size="12" style="fill: var(--sub)">reads <tspan font-family="'Roboto Mono', monospace">i = 0 .. 15</tspan> across row</text>

    <line x1="122" y1="110" x2="95"  y2="156" style="stroke: var(--blue)" stroke-width="1.8" marker-end="url(#arrow-b)"/>
    <line x1="128" y1="110" x2="165" y2="156" style="stroke: var(--blue)" stroke-width="1.8" marker-end="url(#arrow-b)"/>
    <line x1="134" y1="110" x2="235" y2="156" style="stroke: var(--blue)" stroke-width="1.8" marker-end="url(#arrow-b)"/>
    <line x1="140" y1="110" x2="305" y2="156" style="stroke: var(--blue)" stroke-width="1.8" marker-end="url(#arrow-b)"/>

    <!-- Shared Array Slots -->
    <rect x="62"  y="162" width="66" height="36" rx="4" style="fill: var(--blue-fill); stroke: var(--blue)" stroke-width="1.5"/>
    <text x="95"  y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--blue-text)">TILE[0]</text>
    <rect x="132" y="162" width="66" height="36" rx="4" style="fill: var(--blue-fill); stroke: var(--blue)" stroke-width="1.5"/>
    <text x="165" y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--blue-text)">TILE[1]</text>
    <rect x="202" y="162" width="66" height="36" rx="4" style="fill: var(--blue-fill); stroke: var(--blue)" stroke-width="1.5"/>
    <text x="235" y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--blue-text)">TILE[2]</text>
    <rect x="272" y="162" width="66" height="36" rx="4" style="fill: var(--blue-fill); stroke: var(--blue)" stroke-width="1.5"/>
    <text x="305" y="185" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11.5" style="fill: var(--blue-text)">TILE[3]</text>

    <text x="210" y="226" text-anchor="middle" font-size="12.5" style="fill: var(--text)">Read-only scan in Phase 1: safe after barrier.</text>
  </g>
</svg>
